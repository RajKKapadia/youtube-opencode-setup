[project]
name = "linkly"
version = "0.1.0"
description = "A tiny URL shortener: FastAPI + SQLAlchemy 2 + SQLite + Alembic"
readme = "README.md"
requires-python = ">=3.14.7"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "pydantic>=2.14.4",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
